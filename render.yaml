databases:
  - name: zana-live-db
    databaseName: zana_live
    plan: free

services:
  # --- Backend: Quarkus API + WebSockets ---
  - type: web
    name: zana-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /q/health
    envVars:
      - key: QUARKUS_PROFILE
        value: dev   # NOTE: disables OIDC auth entirely. Switch to "prod" + set
                     # OIDC_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET before going live
                     # with real students.
      - key: DB_URL
        fromDatabase:
          name: zana-live-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: zana-live-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: zana-live-db
          property: password
      - key: REDIS_URL
        sync: false   # paste your free Upstash Redis URL here after signup
      - key: ALLOWED_ORIGINS
        value: "*"    # tighten to your frontend's exact URL once it's deployed

  # --- Frontend: Vue 3 static build ---
  - type: web
    name: zana-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to https://zana-backend.onrender.com after backend deploys
      - key: VITE_WS_BASE_URL
        sync: false   # set to wss://zana-backend.onrender.com after backend deploys
