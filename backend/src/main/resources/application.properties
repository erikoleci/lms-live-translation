# ===== App =====
quarkus.application.name=zana-live-translation

# ===== Datasource =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:zana}
quarkus.datasource.password=${DB_PASSWORD:zana}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/zana_live}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# ===== Redis (pub/sub + ephemeral session state) =====
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# ===== OIDC / Keycloak (LMS SSO) =====
# TEMPORARILY hard-disabled (unconditional, not profile-scoped) because relying
# on %dev.quarkus.oidc.enabled=false requires QUARKUS_PROFILE=dev to actually
# take effect at runtime, which was NOT happening reliably on Render -- OIDC
# kept trying (and failing) to reach a non-existent Keycloak at localhost:8081,
# and that failure was happening in the HTTP authentication layer itself
# (before requests even reach our REST resources / ApiExceptionMapper),
# causing 500s on every request whether or not the path even requires auth.
# Once a real Keycloak/OIDC provider is deployed, remove this line and set
# OIDC_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET, then re-enable per-profile below.
quarkus.oidc.enabled=false
quarkus.oidc.auth-server-url=${OIDC_URL:http://localhost:8081/realms/tili}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:zana-live-translation}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:secret}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any

# Public endpoints (join flow must work without login when accessMode=OPEN)
quarkus.http.auth.permission.public.paths=/api/sessions/*/join-info,/api/sessions/by-code/*,/api/sessions/*/qr-code,/api/sessions/*/qr-code/payload,/api/sessions/*/participants,/q/health/*,/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
# TEMPORARILY permit-all (unconditional), same reasoning as oidc.enabled above:
# no identity provider is running yet, so allow everything through and fall
# back to an anonymous principal (SessionResource uses "dev-teacher" then).
# Revert to "authenticated" (profile-scoped for prod) once OIDC is real.
quarkus.http.auth.permission.authenticated.policy=permit

# ===== WebSockets =====
quarkus.websockets-next.server.auto-ping-interval=30s

# ===== CORS (student devices join from LMS iframe / different origin) =====
quarkus.http.cors=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ===== AI Provider credentials (never exposed to frontend, resolved server-side by credentialsRef) =====
zana.provider.openai.api-key=${OPENAI_API_KEY:}
zana.provider.azure.api-key=${AZURE_SPEECH_KEY:}
zana.provider.azure.region=${AZURE_REGION:westeurope}
zana.provider.aws.access-key=${AWS_ACCESS_KEY_ID:}
zana.provider.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ===== Business defaults (overridable via /api/admin config later) =====
zana.session.default-max-participants=300
zana.session.default-expiry-minutes-inactive=120
zana.session.join-token-ttl-minutes=5

# ===== Cache (translation-cache: identical source text + language pair) =====
quarkus.cache.caffeine."translation-cache".expire-after-write=10M
quarkus.cache.caffeine."translation-cache".maximum-size=5000

# ===== OpenAPI =====
quarkus.smallrye-openapi.info-title=Zana Live Translation & Captioning API
quarkus.smallrye-openapi.info-version=1.0.0

# ===== Logging =====
quarkus.log.level=INFO
quarkus.log.category."com.tili.livetranslation".level=DEBUG
