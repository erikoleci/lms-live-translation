# Quarkus Live Translation Backend
quarkus.application.name=live-translation-tili
quarkus.http.port=8080

# Database (H2 për dev - PostgreSQL për prod)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tili_live;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# WebSocket
quarkus.websockets-next.max-frame-size=65536

# CORS - lejo frontend-in Vite (dev) të thërrasë backend-in
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5000
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi

# AI Provider config (example)
ai.stt.provider=OPENAI_REALTIME
ai.stt.api-key=${OPENAI_API_KEY:demo}
ai.translation.provider=OPENAI
ai.tts.provider=OPENAI

# Cost & privacy
session.max-duration-minutes=120
transcript.retention-days=90
recording.enabled-by-default=false